<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Slime - Slimes Battle</title>
  <link rel="stylesheet" href="Assets/style.css">
  <script src="Assets/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">● Slimes Battle</a>
    <ul class="nav-links">
      <li><a href="index.html">Liste</a></li>
      <li><a href="ajout.html">Ajouter</a></li>
      <li><a href="bataille.html">Bataille</a></li>
      <li><a href="tournoi.html">Tournoi</a></li>
    </ul>
  </nav>

  <main class="container">
    <a href="index.html" class="retour">← Retour à la liste</a>

    <section id="fiche" class="fiche">
      <div class="fiche-visuel">
        <img id="slime-gif" class="fiche-gif" src="" alt="">
      </div>

      <div class="fiche-contenu">
        <h1 id="slime-nom"></h1>
        <p id="slime-description" class="subtitle"></p>

        <dl class="stats">
          <div><dt>PV</dt><dd id="slime-pv"></dd></div>
          <div><dt>Force</dt><dd id="slime-force"></dd></div>
          <div><dt>Vitesse</dt><dd id="slime-vitesse"></dd></div>
          <div><dt>Victoires</dt><dd id="slime-victoires"></dd></div>
          <div><dt>Couleur</dt><dd id="slime-couleur"></dd></div>
          <div><dt>État</dt><dd id="slime-repos"></dd></div>
          <div><dt>Boost</dt><dd id="slime-boost"></dd></div>
        </dl>

        <div class="boost-zone">
          <button id="btn-boost" class="btn">Tenter un boost (25 %)</button>
          <p id="boost-message" class="boost-message"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="Assets/data.js"></script>
  <script src="Assets/detail.js"></script>
</body>
</html>
